<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">

        <link rel="stylesheet" href="../css/estilosbase.css">

    <body>
        <header class="definicoes_header_footer">

<a href="../index.html">Início</a> |

        </header>
        
        <h1 class="fonte_cursiva">
            Contato
        </h1>
        <h2>Deixe seu comentário/dúvida!</h2>

        <section>
            <form method="post">
                <section>
                    <section>
                        <p>Nome:</p>
                        <input type="text" placeholder="Nome" class="textos_contato">
                    </section>
                    <section>
                        <p>Email:</p>
                        <input type="email" placeholder="Email" class="textos_contato">
                    </section>
                    <section>
                        <p>Mensgaem:</p>
                        <textarea rows="10" cols="50" placeholder="Mensgaem" class="textos_contato"></textarea>
                    </section>
                </section>
                
                <section style="margin-top: 10px;">
                    <button id="btn_enviar" type="submit">Enviar</button>
                    <button id="btn_limpar" type="reset">Limpar</button>
                </section>
            </form>
        </section>
        
        <footer class="definicoes_header_footer">
            <nav>
                <a href="../index.html">Início</a> |

                <a href="contato.html">Contato</a>
            </nav>
        </footer>
