        <h1>
            Contato
        </h1>

        <section>
            <form method="post">

                <section>
                    <h2>Deixe seu comentário/dúvida!</h2>
                    <section>
                        <p>Nome:</p>
                        <input type="text" placeholder="Nome">
                    </section>
                    <section>
                        <p>Email:</p>
                        <input type="email" placeholder="Email">
                    </section>
                    <section>
                        <p>Mensgaem:</p>
                        <textarea rows="10" cols="50" placeholder="Mensgaem"></textarea>
                    </section>
                </section>
                
                <section style="margin-top: 10px;">
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>
                </section>
            </form>
        </section>
        
        <footer>
            <nav>
                <a href="index.html">Início</a> |

        </footer>
