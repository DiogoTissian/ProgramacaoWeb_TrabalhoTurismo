<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Guia de Turismo - Contato</title>
        <link rel="stylesheet" href="../css/estilosbase.css">
        <link rel="stylesheet" href="../css/contato.css">
    </head>
    <body>
        <header>
            <button id="menu-btn" class="hamburger">
                ☰
            </button>

            <nav id="menu">
                <a href="../index.html">Início</a>
                <a href="pontosturisticoslista.html">Pontos Turísticos</a>
                <a href="Gastronomia.html">Gastronomia</a>
                <a href="Dicas.html">Dicas</a>
                <a href="contato.html">Contato</a>
                <a href="#" id="trocarTema">Trocar tema</a>
            </nav>
        </header>
        
        <main>
            <h1 class="fonte_cursiva">
                Contato
            </h1>
            <h2>Deixe seu comentário/dúvida!</h2>

            <section>
                <form id="formularioContato" method="post">
                    <section>
                        <section>
                            <p>Nome:</p>
                            <input required type="text" placeholder="Nome" class="textos_contato">
                        </section>
                        <section>
                            <p>Email:</p>
                            <input required type="email" placeholder="Email" class="textos_contato">
                        </section>
                        <section>
                            <p>Mensagem:</p>
                            <textarea required rows="10" cols="50" placeholder="Mensgaem" class="textos_contato"></textarea>
                        </section>
                    </section>
                    
                    <section style="margin-top: 10px;">
                        <button id="btn_enviar" type="submit">Enviar</button>
                        <button id="btn_limpar" type="reset">Limpar</button>
                    </section>
                </form>
            </section>
        </main>
        
        <script src="../js/menu.js"></script>
    </body>
</html>
